<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workout Trackers</title>
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#3e6b48">
<style>
  :root {
    --bg: #f6f4ef;
    --card: #ffffff;
    --text: #2d2a26;
    --muted: #7a746c;
    --accent: #3e6b48;
    --border: #e2ddd4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    max-width: 640px;
    margin: 0 auto;
    padding: 1rem;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  header { text-align: center; margin-bottom: 2rem; }
  header h1 { font-size: 1.5rem; letter-spacing: 0.02em; }
  header p { color: var(--muted); font-size: 0.9rem; margin-top: 0.4rem; }
  a.person {
    display: flex;
    align-items: center;
    gap: 1rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.25rem 1.4rem;
    margin-bottom: 0.9rem;
    text-decoration: none;
    color: var(--text);
  }
  a.person:active { background: var(--border); }
  .emoji { font-size: 1.8rem; }
  .who { flex: 1; }
  .who .name { font-weight: 700; font-size: 1.1rem; }
  .who .sub { color: var(--muted); font-size: 0.85rem; margin-top: 0.15rem; }
  .arrow { color: var(--muted); font-size: 1.1rem; }
  footer { text-align: center; color: var(--muted); font-size: 0.78rem; margin-top: 2rem; }
</style>
</head>
<body>

<header>
  <h1>🏋️ Workout Trackers</h1>
  <p>Pick your page — each one saves its own progress.</p>
</header>

<a class="person" href="katie/">
  <span class="emoji">🥾</span>
  <span class="who">
    <span class="name">Katie</span><br>
    <span class="sub">Hiking Strength Program</span>
  </span>
  <span class="arrow">›</span>
</a>

<a class="person" href="elyse/">
  <span class="emoji">💪</span>
  <span class="who">
    <span class="name">Elyse</span><br>
    <span class="sub">Personalized program coming soon</span>
  </span>
  <span class="arrow">›</span>
</a>

<footer>
  Tip: open your page, then use Share → Add to Home Screen to install it like an app.
</footer>

</body>
</html>
